<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="theme-color" content="#010712">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>J.A.R.V.I.S.</title>
<style>
:root{--c:#00f0ff;--rgb:0,240,255;--cyan-bright:#b8fcff;--cyan-mid:#0088ff;--bg:#010712;--bgrgb:1,7,18;--txt:#e6fdff;--txt2:#bdfaff;--fs:16px;--dock-h:200px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
input,textarea,select{user-select:text}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:'Rajdhani',system-ui,sans-serif;color:var(--cyan-bright)}
h2,.status-line,.hud-btn,#stat,.core-center-text{font-family:'Orbitron','Rajdhani',system-ui,sans-serif}
.space-backdrop{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,rgba(0,145,255,.16) 0%,rgba(3,19,38,.72) 48%,#010712 88%),radial-gradient(ellipse at 50% 82%,rgba(0,240,255,.14) 0%,transparent 55%),linear-gradient(180deg,#010712 0%,#031326 50%,#010712 100%);z-index:0;pointer-events:none}
.cyber-grid-overlay{position:fixed;inset:0;background-image:linear-gradient(to right,rgba(0,240,255,.025) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,240,255,.025) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(circle at 50% 46%,rgba(0,0,0,.9) 15%,transparent 72%);-webkit-mask-image:radial-gradient(circle at 50% 46%,rgba(0,0,0,.9) 15%,transparent 72%);z-index:1;pointer-events:none}
.vignette-overlay{position:fixed;inset:0;box-shadow:inset 0 0 130px 45px rgba(1,5,12,.95);z-index:2;pointer-events:none}
#cv{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}

/* ---------- top status strip ---------- */
#bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 4px;pointer-events:none}
#stat{pointer-events:auto;display:flex;gap:10px;font-size:.62rem;letter-spacing:.1em;color:#65ddeb;background:rgba(2,13,28,.7);border:1px solid rgba(var(--rgb),.3);border-radius:12px;padding:7px 12px;backdrop-filter:blur(8px)}
#stat span:empty{display:none}
#stat span+span:not(:empty)::before{content:'·';margin-right:10px;opacity:.5}
#gear{pointer-events:auto;background:rgba(2,13,28,.7);border:1px solid rgba(var(--rgb),.3);border-radius:12px;color:var(--cyan-bright);font-size:18px;padding:5px 10px}

/* ---------- core stage ---------- */
.stage-container{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:1150px;z-index:4;padding:52px 0 var(--dock-h);pointer-events:none}
.jarvis-core-assembly{position:relative;flex:none;width:min(84vw,500px,calc(100dvh - var(--dock-h) - 240px));height:min(84vw,500px,calc(100dvh - var(--dock-h) - 240px));min-width:150px;min-height:150px;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d;margin-top:-2vh;cursor:pointer;will-change:transform;pointer-events:auto}
.holo-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d;will-change:transform}
.holo-layer svg{width:100%;height:100%;overflow:visible}
.spin-cw-ultra-slow{transform-origin:250px 250px;animation:rotateCW 55s linear infinite}
.spin-ccw-slow{transform-origin:250px 250px;animation:rotateCCW 38s linear infinite}
.spin-cw-slow{transform-origin:250px 250px;animation:rotateCW 32s linear infinite}
.spin-ccw-med{transform-origin:250px 250px;animation:rotateCCW 22s linear infinite}
.spin-cw-med{transform-origin:250px 250px;animation:rotateCW 18s linear infinite}
.spin-cw-fast{transform-origin:250px 250px;animation:rotateCW 12s linear infinite}
.spin-ccw-fast{transform-origin:250px 250px;animation:rotateCCW 10s linear infinite}
@keyframes rotateCW{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes rotateCCW{from{transform:rotate(360deg)}to{transform:rotate(0)}}
.core-center-text{position:relative;z-index:25;font-weight:900;font-size:clamp(1.05rem,3.4vw,1.7rem);letter-spacing:.24em;padding-left:.24em;color:#fff;text-shadow:0 0 8px #fff,0 0 18px #00f0ff,0 0 34px #0088ff;transform-style:preserve-3d;animation:pulse 3s ease-in-out infinite;pointer-events:none}
@keyframes pulse{50%{text-shadow:0 0 12px white,0 0 28px #00f0ff,0 0 48px #0088ff}}
.volumetric-beam{position:absolute;bottom:-15%;width:72%;height:54%;background:linear-gradient(to top,rgba(0,240,255,.36),rgba(0,160,255,.14) 52%,transparent);clip-path:polygon(24% 100%,76% 100%,100% 0,0 0);filter:blur(10px);pointer-events:none;z-index:1;opacity:.55}
.core-flash{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,rgba(184,252,255,.55) 0%,rgba(0,240,255,.22) 38%,transparent 70%);opacity:0;pointer-events:none;mix-blend-mode:screen}
.projector-base-wrapper{position:relative;flex:none;width:min(94vw,580px);height:min(32vw,150px);margin-top:-34px;display:flex;align-items:center;justify-content:center;perspective:720px;pointer-events:none;z-index:2}
.projector-disc{width:100%;height:225%;transform:rotateX(75deg);transform-style:preserve-3d;display:flex;align-items:center;justify-content:center}
.projector-disc svg{width:100%;height:100%;overflow:visible}
.proj-spin-cw{transform-origin:250px 250px;animation:rotateCW 26s linear infinite}
.proj-spin-ccw{transform-origin:250px 250px;animation:rotateCCW 17s linear infinite}

/* ---------- caption (Jarvis' words) ---------- */
#me{flex:none;max-width:min(88vw,560px);font-size:.78rem;letter-spacing:.12em;color:#65ddeb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#me:empty{display:none}
#me:not(:empty)::before{content:'YOU › ';opacity:.7}
.speech-caption{flex:none;position:relative;max-width:min(90vw,560px);max-height:17vh;overflow-y:auto;scrollbar-width:none;text-align:center;font-weight:600;font-size:var(--fs);line-height:1.35;letter-spacing:.04em;color:#d4fcff;text-shadow:0 0 14px rgba(0,240,255,.7);padding:6px 24px;border-radius:18px;background:linear-gradient(90deg,transparent,rgba(2,24,46,.62),transparent);pointer-events:auto;white-space:pre-wrap;margin-top:2px}
.speech-caption::-webkit-scrollbar{display:none}
#ai .w{opacity:.42;transition:opacity .18s,text-shadow .18s}
#ai .w.done{opacity:.88}
#ai .w.cur{opacity:1;color:#fff;text-shadow:0 0 10px #00f0ff,0 0 22px #0088ff}
#prev{display:none;flex:none;max-width:min(88vw,520px);border:1px solid rgba(var(--rgb),.3);border-radius:12px;padding:6px 10px;font-size:.8rem;color:var(--txt2);background:rgba(2,13,28,.7);pointer-events:auto;margin-top:4px}
#prev.on{display:block}
#prev .ph{display:flex;justify-content:space-between;gap:10px;margin-bottom:3px;opacity:.85}
#prev img{height:54px;border-radius:8px;margin:2px 0}
#prev .pt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
#prev.open .pt{display:block;max-height:14vh;overflow:auto}
#sugg{flex:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:min(94vw,560px);margin-top:6px;pointer-events:auto}

/* ---------- dock ---------- */
.control-dock{position:fixed;bottom:calc(max(env(safe-area-inset-bottom),40px) + 6px);left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;align-items:center;width:min(94vw,560px)}
.dock-toggle{align-self:flex-end;margin-bottom:6px}
.control-panel{width:100%;max-height:420px;background:rgba(2,13,28,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(var(--rgb),.35);box-shadow:0 0 28px rgba(0,170,255,.22),inset 0 0 14px rgba(var(--rgb),.08);border-radius:16px;padding:10px 12px;overflow:hidden;transition:all .28s cubic-bezier(.16,1,.3,1);transform-origin:bottom center}
.control-panel.collapsed{opacity:0;transform:translateY(14px) scale(.96);pointer-events:none;max-height:0;padding-top:0;padding-bottom:0;border-width:0;margin:0}
.hud-btn{background:rgba(0,180,255,.14);border:1px solid rgba(var(--rgb),.45);color:#bdfaff;font-size:.68rem;letter-spacing:.08em;padding:8px 11px;border-radius:10px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.hud-btn:active{transform:scale(.96)}
.hud-btn.on,#mic.on{background:rgba(255,55,90,.26);border-color:#ff4d6d;color:#ffc2cd;box-shadow:0 0 16px rgba(255,55,90,.5)}
#tb .hud-btn.on{background:rgba(var(--rgb),.3);border-color:var(--c);color:#fff;box-shadow:0 0 14px rgba(var(--rgb),.5)}
.hud-input{background:rgba(1,9,20,.8);border:1px solid rgba(var(--rgb),.35);color:var(--txt);font-family:'Rajdhani',system-ui,sans-serif;font-size:1rem;padding:8px 12px;border-radius:10px;outline:none;width:100%;min-width:0}
.hud-input:focus{border-color:var(--c);box-shadow:0 0 12px rgba(var(--rgb),.32)}
.control-row{display:flex;gap:8px;align-items:center}
.control-row .hud-btn{flex:none;white-space:nowrap}
.status-line{font-size:.6rem;letter-spacing:.13em;color:#65ddeb;margin:0 0 8px 2px;display:flex;justify-content:space-between}
#chips{display:flex;gap:7px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid rgba(var(--rgb),.35);background:rgba(0,180,255,.1);color:var(--txt2);font-family:'Rajdhani',system-ui,sans-serif;font-weight:600;border-radius:14px;padding:6px 12px;font-size:.85rem;white-space:nowrap}
#tb{display:flex;gap:6px;margin-top:8px}
#tb .hud-btn{flex:1;padding:8px 0;font-size:1rem}

/* ---------- overlay panels (settings, notes, history, device) ---------- */
#modal,#np,#dp,#pp{position:fixed;inset:0;background:rgba(var(--bgrgb),.98);display:none;padding:20px;z-index:90;overflow-y:auto}
#modal.show,#np.show,#dp.show,#pp.show{display:flex}
#card,#nc,#dc,#pc{width:100%;max-width:420px;margin:auto}
#card h2,#nc h2,#dc h2,#pc h2{font-weight:700;letter-spacing:.3em;font-size:.9rem;margin:0 0 16px;color:var(--c)}
#card label{display:block;font-size:.8rem;opacity:.75;margin:12px 0 4px}
#card input,#card textarea,#card select{font-family:inherit;width:100%;background:rgba(var(--rgb),.06);border:1px solid rgba(var(--rgb),.3);border-radius:10px;color:var(--txt);padding:11px;font-size:.95rem}
#card button,#nc button,#dc button,#pc button{margin-top:14px;width:100%;padding:12px;border-radius:10px;border:1px solid var(--c);background:rgba(var(--rgb),.14);color:var(--c);font-size:.95rem;font-family:inherit}
.nt{display:flex;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(var(--rgb),.15);font-size:.95rem;color:var(--txt2)}
.nt small{display:block;opacity:.5;font-size:.72rem}
.nt b{opacity:.7;padding:0 6px}
#nf{display:none;width:100%;margin:0 0 8px;background:rgba(var(--rgb),.06);border:1px solid rgba(var(--rgb),.3);border-radius:10px;color:var(--txt);padding:10px;font-size:.95rem;font-family:inherit}
#dc .dr{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(var(--rgb),.15);color:var(--txt2)}
#dc .dr span{flex:1}
#dc .dr button{width:auto;margin:0 0 0 8px;padding:8px 16px;font-size:.9rem}
#dc .dg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
#dc .dg button{margin:0;font-size:.9rem}

/* ---------- simple layout: header + core + composer ---------- */
#hl{display:flex;flex-direction:column;line-height:1.2;pointer-events:auto}
#hl b{font-family:'Orbitron','Rajdhani',system-ui,sans-serif;font-size:.8rem;letter-spacing:.22em;color:var(--txt)}
#st{font-size:.56rem;letter-spacing:.14em;color:#65ddeb;font-family:'Orbitron','Rajdhani',system-ui,sans-serif}
#hr{display:flex;align-items:center;gap:8px}
#stat{background:none;border:0;padding:0;backdrop-filter:none;-webkit-backdrop-filter:none;font-size:.64rem;color:#65ddeb;letter-spacing:.06em}
#gear{background:none;border:0;font-size:20px;padding:6px}
.stage-container{padding:60px 0 var(--dock-h)}
.composer{display:flex;align-items:center;gap:6px;width:100%;background:rgba(2,13,28,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(var(--rgb),.38);box-shadow:0 0 26px rgba(0,170,255,.22);border-radius:30px;padding:6px}
.composer .hud-input{background:transparent;border:0;box-shadow:none;font-size:1.02rem;padding:8px 4px;border-radius:0}
#plus,#mic{width:44px;height:44px;flex:none;border-radius:50%;font-size:1.25rem;padding:0;cursor:pointer;background:rgba(0,180,255,.14);border:1px solid rgba(var(--rgb),.4);color:#bdfaff}
#mic.on{background:rgba(255,55,90,.28);border-color:#ff4d6d;color:#ffc2cd;box-shadow:0 0 16px rgba(255,55,90,.5)}
#mic.send{background:rgba(var(--rgb),.9);color:#012;border-color:var(--c)}
#sheet{position:fixed;inset:0;z-index:80;display:none;background:rgba(1,5,12,.6)}
#sheet.show{display:block}
#sh{position:absolute;left:0;right:0;bottom:0;background:rgba(2,13,28,.97);border-top:1px solid rgba(var(--rgb),.4);border-radius:24px 24px 0 0;padding:10px 14px calc(max(env(safe-area-inset-bottom),40px) + 12px);box-shadow:0 -10px 40px rgba(0,120,255,.25)}
.grab{width:42px;height:4px;border-radius:2px;background:rgba(var(--rgb),.4);margin:0 auto 14px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sbtn{display:flex;flex-direction:column;align-items:center;gap:5px;background:rgba(0,180,255,.1);border:1px solid rgba(var(--rgb),.3);border-radius:14px;padding:12px 2px;color:#bdfaff;font-size:1.35rem}
.sbtn small{font-family:'Orbitron','Rajdhani',system-ui,sans-serif;font-size:.5rem;letter-spacing:.06em}
.sbtn.on{background:rgba(var(--rgb),.3);border-color:var(--c);color:#fff;box-shadow:0 0 14px rgba(var(--rgb),.45)}
.slabel{font-family:'Orbitron','Rajdhani',system-ui,sans-serif;font-size:.58rem;letter-spacing:.2em;color:#65ddeb;margin:16px 2px 8px}
#sh #chips{flex-wrap:wrap;overflow:visible}

#pc .dr{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(var(--rgb),.15);color:var(--txt2)}
#pc .dr span{flex:1}
#pc .dr button{width:auto;margin:0 0 0 8px;padding:7px 12px;font-size:.78rem}
#pc .pchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
#pc .pchips .chip{width:auto;margin:0;padding:6px 12px;font-size:.85rem}
#pc .pin{width:100%;margin-top:8px;background:rgba(var(--rgb),.06);border:1px solid rgba(var(--rgb),.3);border-radius:10px;color:var(--txt);padding:10px;font-size:.95rem;font-family:inherit;user-select:text}
#pc .pnote{font-size:.85rem;color:var(--txt2);opacity:.85;margin:8px 0;white-space:pre-wrap}
#pc .slabel{margin-top:18px}
/* ---------- popup (floating assistant): core + light-blue shade + chat column ---------- */
#px,#po{display:none;position:fixed;top:8px;background:none;border:0;color:var(--cyan-bright);font-size:20px;padding:8px 12px;opacity:.85;z-index:60;text-shadow:0 0 8px rgba(1,7,18,.9)}
#px{right:8px}#po{left:8px}
#shade,#pchat{display:none}
html.pop,body.pop{background:transparent}
body.pop .space-backdrop,body.pop .cyber-grid-overlay,body.pop .vignette-overlay,body.pop #cv,body.pop #bar,body.pop #sheet,body.pop .projector-base-wrapper,body.pop #prev,body.pop #sugg,body.pop #chips,body.pop #tb,body.pop .status-line,body.pop .dock-toggle{display:none}
body.pop .stage-container{padding:34px 0 calc(var(--dock-h) + 33vh)}
body.pop .stage-container{filter:drop-shadow(0 3px 10px rgba(0,32,64,.55))}
html[data-tint=ice] body.pop .stage-container{filter:hue-rotate(14deg) saturate(.78) drop-shadow(0 3px 10px rgba(0,32,64,.55))}
html[data-tint=blue] body.pop .stage-container{filter:hue-rotate(30deg) drop-shadow(0 3px 10px rgba(0,32,64,.55))}
body.pop .core-center-text{text-shadow:0 0 3px #003a63,0 0 8px #003a63,0 0 18px #00f0ff}
body.pop .jarvis-core-assembly{width:min(72vw,36vh);height:min(72vw,36vh);margin-top:0}
body.pop #shade{display:block;position:fixed;left:0;right:0;bottom:0;height:70%;z-index:30;pointer-events:none;border-radius:26px 26px 0 0;background:linear-gradient(to top,rgba(143,211,255,.86) 0%,rgba(143,211,255,.55) 40%,rgba(143,211,255,0) 100%);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);-webkit-mask-image:linear-gradient(to top,#000 58%,transparent);mask-image:linear-gradient(to top,#000 58%,transparent)}
body.pop #pchat{display:flex;flex-direction:column;gap:6px;position:fixed;left:0;right:0;bottom:var(--dock-h);max-height:33vh;overflow-y:auto;scrollbar-width:none;padding:0 14px 4px;z-index:40}
body.pop #pchat::-webkit-scrollbar{display:none}
#pfeed{display:none}
.pb{max-width:86%;padding:8px 12px;border-radius:14px;font-size:calc(var(--fs) * .95);line-height:1.35;white-space:pre-wrap;word-break:break-word;font-weight:600;letter-spacing:.02em;margin:0}
.pb.u{align-self:flex-end;background:rgba(143,211,255,.62);color:#06304f;text-shadow:none;border:1px solid rgba(255,255,255,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pb.a{align-self:flex-start;background:rgba(255,255,255,.72);color:#06304f;text-shadow:none;border:1px solid rgba(255,255,255,.8);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body.pop #ai .w{opacity:.5}
body.pop #ai .w.done{opacity:.95}
body.pop #ai .w.cur{opacity:1;color:#003f66;font-weight:700;text-shadow:none}
body.pop #me::before{content:none}
body.pop #me{color:#08324f;white-space:pre-wrap;overflow:visible;text-overflow:clip;max-width:86%;font-size:calc(var(--fs) * .95);letter-spacing:.02em;margin:0}
body.pop .volumetric-beam{display:none}
body.pop #ai{max-height:none;overflow:visible;text-align:left}
body.pop .control-dock{bottom:10px;z-index:50}
body.pop .composer{background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.85);box-shadow:0 4px 18px rgba(8,50,79,.12)}
body.pop #plus{display:none}
body.pop #mic{background:rgba(8,50,79,.88);color:#d4fcff;border-color:rgba(8,50,79,.95)}
body.pop #hr,body.pop #hl{display:none}
body.pop .control-panel{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.8);box-shadow:0 4px 18px rgba(8,50,79,.12);border-radius:28px;padding:8px 10px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
body.pop .hud-input{border-radius:20px}
body.pop .hud-btn{border-radius:18px}
body.pop .hud-input{background:rgba(255,255,255,.9);color:#08324f;border-color:rgba(8,50,79,.3)}
body.pop .hud-input::placeholder{color:rgba(8,50,79,.55)}
body.pop .hud-btn{background:rgba(8,50,79,.88);color:#d4fcff;border-color:rgba(8,50,79,.95)}
body.pop #mic.on{background:rgba(255,55,90,.9);color:#fff;border-color:#ff4d6d}

/* ---------- options ---------- */
html[data-tint=ice] .stage-container{filter:hue-rotate(14deg) saturate(.78) brightness(1.05)}
html[data-tint=blue] .stage-container{filter:hue-rotate(30deg) brightness(1.05)}
html.lite .holo-layer g[filter]{filter:none}
html.lite .volumetric-beam{filter:none}
html.lite .cyber-grid-overlay{display:none}
@media(max-width:520px){.control-panel{padding:9px 10px}.hud-btn{font-size:.6rem;padding:8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:40s!important;transition:none!important}}
</style></head><body>
<div class="space-backdrop"></div><div class="cyber-grid-overlay"></div><div class="vignette-overlay"></div>
<canvas id="cv"></canvas>
<div id="shade"></div>
<header id="bar"><div id="hl"><b>J.A.R.V.I.S.</b><span id="st">SYSTEM ONLINE</span></div><div id="hr"><div id="stat"><span id="tm"></span><span id="bt"></span><span id="nw"></span><span id="wx"></span></div><button id="gear" aria-label="Settings">⚙</button></div></header>
<button id="px" aria-label="Close">✕</button><button id="po" aria-label="Open full app">↗</button>
<main class="stage-container" id="stage">
  <div class="jarvis-core-assembly" id="core" title="Ketuk Core untuk berbicara">
    <div class="volumetric-beam" id="beam"></div><div class="core-flash" id="flash"></div>


    <!-- LAPISAN 1: Halo eksternal dan bracket lengkung -->
    <div class="holo-layer" data-base-z="-65" data-z-amp="-45" data-scale-amp=".06"><svg viewBox="0 0 500 500">

async function getText(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status+' for '+u);return await r.text()}
async function getJson(u,h){try{const r=await fetch(u,{headers:h||{}});if(!r.ok)return null;return await r.json()}catch(e){return null}}
function parseSkill(md,fb){
  let name=fb,desc='',body=md;const m=md.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
  if(m){
    body=m[2];const fm=m[1];
    const g=k=>{const x=fm.match(new RegExp('^'+k+':[ \\t]*(.*)$','mi'));if(!x)return '';let v=x[1].trim();
      if(/^[>|][+-]?$/.test(v)){const rest=fm.slice(fm.indexOf(x[0])+x[0].length).split('\n').slice(1),out=[];for(const l of rest){if(/^\s+\S/.test(l))out.push(l.trim());else break}v=out.join(' ')}
      return v.replace(/^["']|["']$/g,'')};
    name=g('name')||fb;desc=g('description');
  }
  return {name:String(name).toLowerCase().replace(/[^a-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48),desc:desc.slice(0,300),body:body.trim().slice(0,20000)};
}
function saveSkill(s,src){if(!s.name||!s.body)return false;const L=skills().filter(x=>x.name!==s.name);L.push(Object.assign({},s,{src}));saveS(L);return true}
async function installSkill(src){
  src=(ALIASES[src.trim().toLowerCase()]||src).trim();
  if(/^https?:\/\/\S+\.md(\?\S*)?$/i.test(src)){
    const u=src.replace(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/,'https://raw.githubusercontent.com/$1/$2/$3');
    const s=parseSkill(await getText(u),u.split('/').slice(-2,-1)[0]||'skill');return saveSkill(s,src)?[s.name]:[];
  }
  const m=src.replace(/^https?:\/\/github\.com\//,'').match(/^([^/#\s]+)\/([^/#\s]+?)(?:\.git)?(?:\/tree\/[^#]*)?(?:#(.+))?$/);
  if(!m)throw new Error('Use owner/repo, a GitHub link, or a link to a SKILL.md file.');
  const o=m[1],rp=m[2],flt=m[3];
  const tr=await getJson('https://api.github.com/repos/'+o+'/'+rp+'/git/trees/HEAD?recursive=1',{accept:'application/vnd.github+json'});
  if(!tr||!tr.tree)throw new Error('Could not read github.com/'+o+'/'+rp+' (wrong name, or GitHub is rate limiting for a while).');
  let ps=tr.tree.filter(x=>x.type==='blob'&&/(^|\/)SKILL\.md$/i.test(x.path)).map(x=>x.path);
  if(flt)ps=ps.filter(p=>p.toLowerCase().includes(flt.toLowerCase()));
  ps=ps.slice(0,30);const done=[];
  for(const p of ps){try{const s=parseSkill(await getText('https://raw.githubusercontent.com/'+o+'/'+rp+'/HEAD/'+p),p.split('/').slice(-2,-1)[0]||rp);if(saveSkill(s,o+'/'+rp))done.push(s.name)}catch(e){}}
  return done;
}
async function findSkills(q){
  const j=await getJson('https://skills.sh/api/search?q='+encodeURIComponent(q));
  if(j){const arr=Array.isArray(j)?j:(j.skills||j.results||j.data||[]);
    if(arr.length)return arr.slice(0,10).map(x=>(x.name||x.id||x.title||'?')+((x.source||x.repo)?' - '+(x.source||x.repo):'')+(x.installs?' ('+x.installs+' installs)':'')+(x.description?': '+String(x.description).slice(0,90):'')).join('\n')+'\n(Install with the owner/repo shown.)'}
  return await search('agent skill SKILL.md '+q+' github');
}

/* ----- MCP over HTTP ----- */
const MCPMAP={};
function jrpc(tx,ct,id){
  if(/event-stream/i.test(ct)||/^\s*(event|data):/m.test(tx)){
    let last=null;tx.split(/\r?\n/).forEach(l=>{if(l.startsWith('data:')){try{const j=JSON.parse(l.slice(5).trim());if(j&&(j.id===id||last===null))last=j}catch(e){}}});
    if(!last)throw new Error('empty reply from the MCP server');if(last.error)throw new Error(last.error.message||'MCP error');return last.result;
  }
  const j=JSON.parse(tx);if(j.error)throw new Error(j.error.message||'MCP error');return j.result;
}
async function postForm(u,o){
  const r=await fetch(u,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded',accept:'application/json'},body:new URLSearchParams(o).toString()});
  let j={};try{j=await r.json()}catch(e){}if(!r.ok&&!j.error)j.error='HTTP '+r.status;return j;
}
async function mcpTok(c){
  if(c.token)return c.token;const a=c.auth;if(!a||!a.at)return '';
  if(a.exp&&Date.now()>a.exp-60000&&a.rt&&a.as){
    const r=await postForm(a.as.token_endpoint,{grant_type:'refresh_token',refresh_token:a.rt,client_id:a.cid,resource:c.url});
    if(r.access_token){a.at=r.access_token;if(r.refresh_token)a.rt=r.refresh_token;a.exp=r.expires_in?Date.now()+r.expires_in*1000:0;upd(c)}
  }
  return a.at;
}
async function mcpPost(c,body,note){
  const h={'content-type':'application/json',accept:'application/json, text/event-stream'};
  if(c.sess)h['mcp-session-id']=c.sess;if(c.proto)h['mcp-protocol-version']=c.proto;
  const tk=await mcpTok(c);if(tk)h.authorization='Bearer '+tk;
  const r=await fetch(c.url,{method:'POST',headers:h,body:JSON.stringify(body)});
  if(r.status===401){const e=new Error('sign-in required');e.auth=true;e.www=(r.headers&&r.headers.get&&r.headers.get('www-authenticate'))||'';throw e}
  if(!r.ok){let t='';try{t=(await r.text()).slice(0,120)}catch(e){}throw new Error('MCP server answered HTTP '+r.status+' '+t)}
  const sid=r.headers&&r.headers.get&&r.headers.get('mcp-session-id');if(sid)c.sess=sid;
  if(note)return null;
  return jrpc(await r.text(),(r.headers&&r.headers.get&&r.headers.get('content-type'))||'',body.id);
}
async function mcpInit(c){
  c.sess='';const r=await mcpPost(c,{jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2025-06-18',capabilities:{},clientInfo:{name:'Jarvis',version:'1.0'}}});
  c.proto=(r&&r.protocolVersion)||'2025-06-18';try{await mcpPost(c,{jsonrpc:'2.0',method:'notifications/initialized'},true)}catch(e){}
}
async function mcpTools(c){
  let L=[],cur;
  for(let i=0;i<6;i++){const r=await mcpPost(c,{jsonrpc:'2.0',id:10+i,method:'tools/list',params:cur?{cursor:cur}:{}});L=L.concat(r.tools||[]);cur=r.nextCursor;if(!cur)break}
  c.tools=L.map(t=>({name:t.name,description:(t.description||'').slice(0,300),schema:t.inputSchema||{type:'object',properties:{}}}));upd(c);return c.tools.length;
}
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rnd=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return b64u(a)};
async function oauthBegin(c,www){
  const u=new URL(c.url),rm=(www.match(/resource_metadata="([^"]+)"/)||[])[1];
  const prm=await getJson(rm||(u.origin+'/.well-known/oauth-protected-resource'+(u.pathname!=='/'?u.pathname:'')))||await getJson(u.origin+'/.well-known/oauth-protected-resource')||{};
  const asu=((prm.authorization_servers||[])[0]||u.origin).replace(/\/$/,'');
  const meta=await getJson(asu+'/.well-known/oauth-authorization-server')||await getJson(asu+'/.well-known/openid-configuration');
  if(!meta||!meta.authorization_endpoint||!meta.token_endpoint)throw new Error('Could not find this service’s sign-in settings.');
  let cid=c.auth&&c.auth.cid;
  if(!cid){
    if(!meta.registration_endpoint)throw new Error('This service requires a pre-registered app and does not let Jarvis sign in automatically.');
    const rr=await fetch(meta.registration_endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({client_name:'Jarvis',redirect_uris:[REDIR],grant_types:['authorization_code','refresh_token'],response_types:['code'],token_endpoint_auth_method:'none'})});
    let rj={};try{rj=await rr.json()}catch(e){}
    if(!rj.client_id)throw new Error('The service did not accept Jarvis as an app ('+(rj.error_description||rj.error||('HTTP '+rr.status))+').');
    cid=rj.client_id;
  }
  const ver=rnd(48),st=rnd(16),ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));
  c.auth={cid,as:{authorization_endpoint:meta.authorization_endpoint,token_endpoint:meta.token_endpoint},ver,st};upd(c);
  const q=new URLSearchParams({response_type:'code',client_id:cid,redirect_uri:REDIR,code_challenge:ch,code_challenge_method:'S256',state:st,resource:c.url});
  if(prm.scopes_supported&&prm.scopes_supported.length)q.set('scope',prm.scopes_supported.join(' '));
  const n=NB();if(!n)throw new Error('Signing in needs the installed app.');
  await n.openUrl({url:meta.authorization_endpoint+(meta.authorization_endpoint.includes('?')?'&':'?')+q.toString()});
  return 'Opening the sign-in page. Approve access there, then you will come back to Jarvis.';
}
async function oauthDone(url){
  let q;try{q=new URL(url).searchParams}catch(e){return}
  const code=q.get('code'),st=q.get('state'),err=q.get('error');
  const c=conns().find(x=>x.auth&&x.auth.st&&x.auth.st===st);if(!c)return;
  if(err||!code){say('Sign-in was cancelled'+(err?': '+err:'')+'.');return}
  const a=c.auth,r=await postForm(a.as.token_endpoint,{grant_type:'authorization_code',code,redirect_uri:REDIR,client_id:a.cid,code_verifier:a.ver,resource:c.url});
  if(!r.access_token){say('Sign-in failed: '+(r.error_description||r.error||'no token')+'.');return}
  a.at=r.access_token;a.rt=r.refresh_token||'';a.exp=r.expires_in?Date.now()+r.expires_in*1000:0;a.st='';a.ver='';upd(c);
  try{await mcpInit(c);const k=await mcpTools(c);say(c.name+' connected, '+k+' tools ready.')}catch(e){say(c.name+': '+e.message)}

}
async function connect(c){

  catch(e){if(e.auth)return await oauthBegin(c,e.www);throw e}
}
function mcpDefs(text,prev){
  Object.keys(MCPMAP).forEach(k=>delete MCPMAP[k]);const defs=[];
  for(const c of conns()){
    if(!c.tools||!c.tools.length)continue;
    const all=c.tools.map(t=>({nm:(c.id+'_'+t.name).replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,64),t}));
    all.forEach(x=>{MCPMAP[x.nm]={c:c.id,t:x.t.name}});
    const kw=c.name.toLowerCase().replace(/[^a-z0-9 ]/g,'').split(/\s+/).filter(Boolean).join('|');
    if(!(kw&&new RegExp('\\b('+kw+')\\b','i').test(text))&&!all.some(x=>prev.includes(x.nm)))continue;
    const words=text.toLowerCase().split(/\W+/).filter(w=>w.length>3);
    all.map(x=>({x,s:words.filter(w=>(x.t.name+' '+x.t.description).toLowerCase().includes(w)).length})).sort((a,b)=>b.s-a.s).slice(0,30).forEach(({x})=>{
      const sc=JSON.parse(JSON.stringify(x.t.schema||{}));delete sc.$schema;if(!sc.type)sc.type='object';if(!sc.properties)sc.properties={};
      defs.push({type:'function',function:{name:x.nm,description:('['+c.name+'] '+x.t.description).slice(0,300),parameters:sc}});
    });
  }
  return defs;
}
async function mcpRun(nm,a){
  const m=MCPMAP[nm],c=m&&conns().find(x=>x.id===m.c);if(!c)return 'That connector tool is no longer available.';
  const call=()=>mcpPost(c,{jsonrpc:'2.0',id:Date.now()%1000000000,method:'tools/call',params:{name:m.t,arguments:a||{}}});
  let r;
  try{r=await call()}catch(e){
    if(e.auth)return c.name+' needs you to sign in again. Say "connect '+c.name+'".';
    if(/HTTP 404/.test(e.message)){try{await mcpInit(c);r=await call()}catch(e2){return 'Failed: '+e2.message}}else return 'Failed: '+e.message;
  }

}

async function ask(text){
  Q.length=0;turn++;
  archive();const shown=text;lastUserText=shown;if(searchOn){text='Search the web first and answer: '+text;searchOn=false;$('sb').classList.remove('on');$('txt').placeholder='Ketik perintah untuk J.A.R.V.I.S....'}
  $('me').textContent=shown;hist.push({role:'user',content:text});saveH();logH('u',text);setMode('thinking');say('…');
  try{
    if(!navigator.onLine){await finishLocal((await offline(text))||'I am offline, sir. Only local commands work: flashlight, volume, timers, notes, battery and the time.');return}
    await refreshCtx();
    let out,via='';
    const sys=sysFull()+' Your built-in knowledge is outdated and incomplete. For ANY question about movies, TV, games, tech, products, people, sports, news, prices, release dates or whether something is released, delayed or cancelled, you MUST call web_search first and trust the results over your memory; mention dates. Use tools for phone settings, device_capabilities, shizuku_status, shizuku_request_access, volume_status, Spotify, calendar, reminders, WhatsApp, notes, tasks, weather, email, clipboard, notifications, smart home and screen questions. For app UI automation, inspect the visible screen or UI tree first, use exact visible labels when possible, use coordinate taps only when the coordinates came from the current screen tree, never guess coordinates, and verify important actions afterward. If an action fails, inspect the screen again and adapt once rather than repeating blindly. Do not claim success unless the tool confirms it. Never type into password fields. Always use calculate for arithmetic. For a briefing, combine weather, device_status, tasks and notes into a short summary. For translations give only the translation. For multi-step goals, plan, chain tools until finished, then report briefly. Before irreversible or sensitive actions (sending messages or email, deleting files, purchases) ask the user to confirm and wait for their reply. Use delegate for complex research, coding, writing or planning sub-tasks. Never identify real people from their faces. After acting, say only the useful outcome in a few words (what is playing, when the alarm rings, what was opened), phrased differently each time, with no filler. Tool results are for you: never read them out verbatim. Never clear notes unless explicitly told to.';
    const base=pickTools(text);const tools=/whats?app|\bwa\b/i.test(text)?[...base,WA]:base;const used=new Set();
    const hs=hist.slice(-12);while(hs.length&&hs[0].role!=='user')hs.shift();
    const msgs=[{role:'system',content:sys},...hs];
    for(let i=0;i<10&&!out;i++){
      const r=await chat(msgs,{tools,max:600});via=r.p.n;
      if(r.tool_calls.length){
        msgs.push(Object.assign({role:'assistant',content:r.content||'',tool_calls:r.tool_calls},r.reasoning?{reasoning_content:r.reasoning}:{}));
        for(const c of r.tool_calls){let a={};try{a=JSON.parse(c.function.arguments||'{}')}catch(e){}
          say('Running '+c.function.name+'…');used.add(c.function.name);
          msgs.push({role:'tool',tool_call_id:c.id,content:String(await runTool(c.function.name,a))})}
      }else out=r.content;
    }
    prevTools=[...used];
    if(!out){const F=['At once, sir.','Right away.','Handled.','On it.'];out=F[Math.floor(Math.random()*F.length)]}
    if(providers().length>1)$('me').textContent=shown+'  ·  via '+via;
    hist.push({role:'assistant',content:out});saveH();logH('a',out);condense();say(out);suggest(used);await speak(out);await flushQ();
  }catch(e){
    if(/fetch|network|load failed|timeout|connect/i.test(String(e.message))){const o=await offline(text).catch(()=>null);if(o){await finishLocal(o);return}}
    say('Error: '+e.message);setMode('idle')}
}

/* ---------- voice out (Fish Audio) ---------- */
async function ttsBytes(body){
  const url='https://api.fish.audio/v1/tts',headers={'Authorization':'Bearer '+cfg.fk,'Content-Type':'application/json','model':cfg.fm||'s1'};
  const H=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorHttp;
  if(H){ // native HTTP returns binary as base64 (the patched fetch corrupts audio)
    const r=await H.request({url,method:'POST',headers,data:body,responseType:'arraybuffer'});
    if(r.status>=300)throw new Error('Fish Audio '+r.status);
    if(typeof r.data!=='string')throw new Error('Fish Audio returned no audio');
    const bin=atob(r.data),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer;
  }
  const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});
  if(!r.ok)throw new Error('Fish Audio '+r.status);
  return r.arrayBuffer();
}
async function speak(text){
  audio();
  const spoken=text.replace(/```[\s\S]*?```/g,' The code is in the text card. ').replace(/\s+/g,' ').trim();
  if(/```/.test(text))setPrev('📄 Teks lengkap',text);
  buildCap(spoken);
  try{
    const body={text:spoken,format:'mp3',latency:'balanced'};if(cfg.vid)body.reference_id=cfg.vid;
    const ab=await ctx.decodeAudioData(await ttsBytes(body));
    playSrc=ctx.createBufferSource();playSrc.buffer=ab;playSrc.connect(an);an.connect(ctx.destination);
    setMode('speaking');
    await new Promise(res=>{playSrc.onended=res;playSrc.start();kStart(ab.duration,()=>ctx.currentTime)});
  }catch(e){if(!$('prev').classList.contains('on'))setPrev('⚠ Suara',e.message+' — memakai suara HP');await localSpeak(spoken)}
  kStop();try{an.disconnect()}catch(e){}playSrc=null;setMode('idle');if(hf&&!Q.length)setTimeout(()=>{if(mode==='idle')startRec()},350);
}

/* ---------- voice in ---------- */
function toWav(ab){const d=ab.getChannelData(0),sr=ab.sampleRate,o=new DataView(new ArrayBuffer(44+d.length*2));
  const w=(p,s)=>{for(let i=0;i<s.length;i++)o.setUint8(p+i,s.charCodeAt(i))};
  w(0,'RIFF');o.setUint32(4,36+d.length*2,true);w(8,'WAVEfmt ');o.setUint32(16,16,true);o.setUint16(20,1,true);o.setUint16(22,1,true);o.setUint32(24,sr,true);o.setUint32(28,sr*2,true);o.setUint16(32,2,true);o.setUint16(34,16,true);w(36,'data');o.setUint32(40,d.length*2,true);
  for(let i=0;i<d.length;i++){const s=Math.max(-1,Math.min(1,d[i]));o.setInt16(44+i*2,s<0?s*32768:s*32767,true)}
  return new Blob([o],{type:'audio/wav'})}
async function startRec(){
  audio();
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){say('Microphone unavailable: '+e.message);return}
  micSrc=ctx.createMediaStreamSource(stream);micSrc.connect(an);
  chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=async()=>{
    try{micSrc.disconnect()}catch(e){}stream.getTracks().forEach(t=>t.stop());if(cancel){cancel=0;setMode('idle');say('Standing by, sir.');return}setMode('thinking');say('…');
    try{
      const ab=await ctx.decodeAudioData(await new Blob(chunks).arrayBuffer());
      const fd=new FormData();fd.append('audio',toWav(ab),'speech.wav');fd.append('ignore_timestamps','true');
      const r=await fetch('https://api.fish.audio/v1/asr',{method:'POST',headers:{'Authorization':'Bearer '+cfg.fk},body:fd});
      if(!r.ok)throw new Error('ASR '+r.status);
      const t=((await r.json()).text||'').trim();
      if(!t){say('I didn’t catch that, sir.');setMode('idle');return}
      ask(t);
    }catch(e){say('Transcription failed: '+e.message+'. You can type instead.');setMode('idle')}
  };
  heard=0;recStart=lastLoud=performance.now();rec.start();archive();setMode('listening');say('Listening…');
}
function stopRec(){if(rec&&rec.state!=='inactive')rec.stop()}
function micToggle(){
  if(!cfg.ak||!cfg.fk)return openCfg();

}

/* ---------- holographic core engine (design: JARVIS Holographic Core) ---------- */
const cv=$('cv'),g=cv.getContext('2d');let W,H,dpr,parts=[];
const spr=document.createElement('canvas');spr.width=spr.height=32;
(()=>{const c=spr.getContext('2d'),gr=c.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,'rgba(200,253,255,1)');gr.addColorStop(.25,'rgba(116,239,255,.75)');gr.addColorStop(1,'rgba(0,223,255,0)');c.fillStyle=gr;c.fillRect(0,0,32,32)})();
function mkParts(){const n=document.documentElement.classList.contains('lite')?40:Math.min(90,Math.floor(W*H/9500));parts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.4,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.28,a:Math.random()*.65+.15,p:Math.random()*6.2832}))}
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);mkParts()}
addEventListener('resize',size);size();

const LAY=[...document.querySelectorAll('.holo-layer')].map((el,i)=>({el,bz:+el.dataset.baseZ||0,za:+el.dataset.zAmp||0,sa:+el.dataset.scaleAmp||0,ph:i*1.3}));
const asm=$('core'),beam=$('beam'),flash=$('flash'),ctr=$('ctr');
let ANIMS=[];const getAnims=()=>{try{ANIMS=document.getAnimations().filter(a=>/^rotate/.test(a.animationName||''))}catch(e){ANIMS=[]}};
setTimeout(getAnims,400);setTimeout(getAnims,2500);

/* word-by-word caption: every spoken word kicks the core */
const KJ={on:false,spans:[],cum:[],starts:[],tot:1,t0:0,dur:1,i:-1,clk:()=>0};
let lvl=0,t=0,last=performance.now(),kick=0,rate=1,lastRate=1,E=0,fakeVoice=false;
function buildCap(text){
  const c=$('ai');c.textContent='';c.scrollTop=0;KJ.on=false;KJ.spans=[];KJ.starts=[];KJ.i=-1;
  const re=/\S+/g;let m;
  while((m=re.exec(text))){const s=document.createElement('span');s.className='w';s.textContent=m[0]+' ';c.appendChild(s);KJ.spans.push(s);KJ.starts.push(m.index)}
  let a=0;KJ.cum=KJ.spans.map(s=>{const w=s.textContent.trim();a+=w.length+(/[.,!?;:]$/.test(w)?4:0)+1;return a});KJ.tot=a||1;
}
function kStart(dur,clk){KJ.on=true;KJ.dur=Math.max(.3,dur);KJ.clk=clk;KJ.t0=clk();KJ.i=-1}
function kSet(i){
  if(i===KJ.i||i<0||i>=KJ.spans.length)return;KJ.i=i;
  KJ.spans.forEach((s,j)=>{s.classList.toggle('done',j<i);s.classList.toggle('cur',j===i)});
  kick=1;const c=$('ai'),s=KJ.spans[i];c.scrollTop=Math.max(0,s.offsetTop-c.clientHeight/2);
}
function kTick(){if(!KJ.on)return;const p=Math.max(0,Math.min(1,(KJ.clk()-KJ.t0)/KJ.dur))*KJ.tot;let i=0;while(i<KJ.cum.length-1&&KJ.cum[i]<=p)i++;kSet(i)}
function kStop(){KJ.on=false;KJ.spans.forEach(s=>{s.classList.remove('cur');s.classList.add('done')})}

function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;t+=dt;
  let tl=0;
  if(an&&(mode==='listening'||mode==='speaking')&&!fakeVoice){tl=Math.min(1,rms()*(mode==='listening'?5:3.2))}
  else if(mode==='speaking'&&fakeVoice)tl=KJ.on?.3+.3*Math.abs(Math.sin(t*8.3)):.1;
  else if(mode==='thinking')tl=.18+.12*Math.sin(t*5);
  lvl+=(tl-lvl)*(tl>lvl?.35:.08);
  if(mode==='listening'){const n=performance.now();if(tl>.12){heard=1;lastLoud=n}if(!heard&&n-recStart>8000){cancel=1;hf=false;hfSync();stopRec()}else if((heard&&n-lastLoud>1400)||n-recStart>25000)stopRec()}
  kTick();
  kick*=Math.exp(-7*dt);
  E=Math.min(1,lvl*1.15+kick*.3);
  const base={idle:1,listening:1.5,thinking:2.4,speaking:1.3}[mode]||1;
  rate+=(base+E*3.2-rate)*Math.min(1,dt*6);
  if(Math.abs(rate-lastRate)>.02){lastRate=rate;for(const a of ANIMS){try{a.playbackRate=rate}catch(e){}}}
  for(const L of LAY){
    const z=L.bz+L.za*E*Math.sin(t*2.2+L.ph),s=1+L.sa*E*(.7+.3*Math.sin(t*3+L.ph))+.006*Math.sin(t*.9+L.ph);
    L.el.style.transform='translateZ('+z.toFixed(1)+'px) scale('+s.toFixed(4)+')';
  }
  asm.style.transform='rotateX('+(Math.sin(t*.5)*2.2+E*Math.sin(t*6.5)*2.5).toFixed(2)+'deg) rotateY('+(Math.cos(t*.37)*3.2+E*Math.sin(t*5.1)*3).toFixed(2)+'deg) scale('+(1+E*.05).toFixed(3)+')';
  beam.style.opacity=(.5+E*.5).toFixed(3);flash.style.opacity=(E*.9).toFixed(3);ctr.style.transform='scale('+(1+E*.12).toFixed(3)+')';
  g.clearRect(0,0,W,H);
  const sp=1+E*3;
  for(const p of parts){
    p.x+=p.vx*sp;p.y+=p.vy*sp;p.p+=.018;
    if(p.x<-5)p.x=W+5;if(p.x>W+5)p.x=-5;if(p.y<-5)p.y=H+5;if(p.y>H+5)p.y=-5;
    g.globalAlpha=p.a*(.65+.35*Math.sin(p.p));const d=p.r*6;g.drawImage(spr,p.x-d/2,p.y-d/2,d,d);
  }
  g.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
